dependencies {
    compileOnly group: "javax.portlet", name: "portlet-api", version: "2.0"
    compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.0.1"
    compileOnly group: "com.liferay.portal", name: "release.portal.api"


  compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "4.0.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.taglib", version: "4.0.0"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.4.0"
	compileOnly group: "org.osgi", name: "org.osgi.annotation.versioning", version: "1.1.0"
	compileOnly group: "org.osgi", name: "org.osgi.annotation.bundle", version: "1.0.0"
}

plugins.withId("com.liferay.node") {
	tasks.matching { it.name == 'npmInstall' }.configureEach { enabled = false }
	tasks.matching { it.name == 'yarnInstall' }.configureEach { enabled = false }

	task pnpmInstall(type: Exec) {
		commandLine 'pnpm', 'install'
		workingDir projectDir
		group = "node"
		description = "Installs dependencies using pnpm."
	}
}

subprojects {
	plugins.withId("com.liferay.node") {
		tasks.matching { it.name == 'npmInstall' }.configureEach { 
			enabled = false 
		}
		tasks.matching { it.name == 'yarnInstall' }.configureEach { 
			enabled = false 
		}
		
		tasks.matching { it.name == 'packageRunBuild' }.configureEach { 
			enabled = false 
		}

		task pnpmInstall(type: Exec) {
			commandLine 'pnpm', 'install'
			workingDir projectDir
			group = "node"
			description = "Installs dependencies using pnpm."
		}

		task pnpmBuild(type: Exec) {
			dependsOn pnpmInstall
			mustRunAfter "processResources"
			commandLine 'pnpm', 'run', 'build'
			workingDir projectDir
			group = "node"
			description = "Runs build script using pnpm."
		}

		tasks.named("jar") {
			dependsOn pnpmBuild
		}
		// TODO: evaluate if this is necessary
		tasks.named("build") {
			dependsOn pnpmBuild
		}
	}
}